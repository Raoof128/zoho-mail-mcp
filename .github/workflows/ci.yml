name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs the exact lockfile. A dependency that only resolves with `npm install`
      # is a change to review, not something to paper over in CI.
      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Runs against the real Workers runtime through @cloudflare/vitest-plugin, not a mock.
      - name: Tests
        run: npm test

      # The supplemental corpus intentionally uses the pre-recovery writer baseline.
      - name: Fetch immutable legacy writer baseline
        run: git fetch --no-tags --depth=1 origin 6e78bc548c97bbe5194e3f780c717e5519930c1a

      - name: Installed SQL conformance
        run: |
          python3 scripts/qualification/sql_conformance.py
          python3 scripts/qualification/capture_writer_corpus.py --check

      - name: Plan 6 contract checks
        run: node docs/superpowers/reviews/2026-09-15-plan-6-contract-check.mjs
